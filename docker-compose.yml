services:
  db:
    image: postgres:15-alpine
    container_name: disaster_response_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disaster_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disaster_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-disaster_response_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disaster_admin} -d ${POSTGRES_DB:-disaster_response_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_response_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-disaster_admin}:${POSTGRES_PASSWORD:-disaster_secure_pass_123}@db:5432/${POSTGRES_DB:-disaster_response_db}
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster_response_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
